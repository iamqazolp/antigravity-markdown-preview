<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>

    <!-- Light base gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="0.5" stop-color="#F6F3FF"/>
      <stop offset="1" stop-color="#FFF1EE"/>
    </linearGradient>

    <!-- Pastel Gemini-color glows -->
    <radialGradient id="gBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3186FF" stop-opacity="0.30"/><stop offset="1" stop-color="#3186FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F94543" stop-opacity="0.18"/><stop offset="1" stop-color="#F94543" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#08B962" stop-opacity="0.22"/><stop offset="1" stop-color="#08B962" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gYellow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FABC12" stop-opacity="0.30"/><stop offset="1" stop-color="#FABC12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Solid (fully opaque) Gemini gradients: red -> yellow -> green -> blue, no muddy mixing -->
    <!-- M: horizontal, so left leg = red, left diagonal = yellow, right diagonal = green, right leg = blue -->
    <linearGradient id="gradM" gradientUnits="userSpaceOnUse" x1="86" y1="0" x2="282" y2="0">
      <stop offset="0.09" stop-color="#F94543"/>
      <stop offset="0.33" stop-color="#FABC12"/>
      <stop offset="0.67" stop-color="#08B962"/>
      <stop offset="0.91" stop-color="#3186FF"/>
    </linearGradient>
    <!-- Arrow: vertical, red at top -> yellow -> green -> blue at the tip -->
    <linearGradient id="gradA" gradientUnits="userSpaceOnUse" x1="0" y1="111" x2="0" y2="295">
      <stop offset="0.10" stop-color="#F94543"/>
      <stop offset="0.38" stop-color="#FABC12"/>
      <stop offset="0.64" stop-color="#08B962"/>
      <stop offset="0.90" stop-color="#3186FF"/>
    </linearGradient>

    <!-- Light Gemini gradient for the review lines (shared across both so they match) -->
    <linearGradient id="gradLines" gradientUnits="userSpaceOnUse" x1="86" y1="0" x2="256" y2="0">
      <stop offset="0"    stop-color="#F94543"/>
      <stop offset="0.35" stop-color="#FABC12"/>
      <stop offset="0.68" stop-color="#08B962"/>
      <stop offset="1"    stop-color="#3186FF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2B3A7A" flood-opacity="0.16"/>
    </filter>
    <filter id="bubbleShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2B3A7A" flood-opacity="0.22"/>
    </filter>

    <!-- Antigravity icon parts -->
    <mask height="23" id="ag-0" maskUnits="userSpaceOnUse" width="24" x="0" y="1"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z" fill="#fff"></path></mask>
    <filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="17.587" id="ag-1" width="19.838" x="-3.288" y="-11.917"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="1.117"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="38.565" id="ag-2" width="38.9" x="4.251" y="-13.493"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="5.4"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="36.517" id="ag-3" width="40.955" x="-21.889" y="-10.592"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="4.591"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="36.517" id="ag-4" width="40.955" x="-21.889" y="-10.592"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="4.591"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="36.595" id="ag-5" width="36.632" x="-19.099" y="-10.278"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="4.591"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="34.087" id="ag-6" width="33.533" x=".981" y="8.758"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="4.363"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="35.276" id="ag-7" width="35.978" x="-6.143" y="-21.659"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="3.954"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="46.523" id="ag-8" width="45.114" x="-11.96" y="-.46"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="3.531"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="24.054" id="ag-9" width="25.094" x="10.485" y=".58"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="3.159"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="30.007" id="ag-10" width="33.508" x="5.833" y="-12.467"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="2.669"></feGaussianBlur></filter><filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="26.151" id="ag-11" width="22.194" x="-8.355" y="-8.876"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_977_115" stdDeviation="3.303"></feGaussianBlur></filter>
  </defs>

  <!-- Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="440" cy="60"  r="230" fill="url(#gBlue)"/>
    <circle cx="50"  cy="70"  r="190" fill="url(#gRed)"/>
    <circle cx="50"  cy="470" r="210" fill="url(#gGreen)"/>
    <circle cx="470" cy="480" r="190" fill="url(#gYellow)"/>
    <rect x="24" y="24" width="464" height="232" fill="url(#shine)"/>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#D9E0F3" stroke-width="3"/>

  <!-- M↓ : each shape gets the full Gemini gradient, fully opaque -->
  <g filter="url(#softShadow)" fill="none" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="104,280 104,130 184,215 264,130 264,280" stroke="url(#gradM)"/>
    <g stroke="url(#gradA)">
      <line x1="360" y1="130" x2="360" y2="268"/>
      <polyline points="316,232 360,276 404,232"/>
    </g>
  </g>

  <!-- Review lines -->
  <rect x="86" y="346" width="170" height="16" rx="8" fill="url(#gradLines)" fill-opacity="0.42"/>
  <rect x="86" y="380" width="120" height="16" rx="8" fill="url(#gradLines)" fill-opacity="0.42"/>

  <!-- Comment bubble (body spans x 282-422, centered at 352) -->
  <path filter="url(#bubbleShadow)"
        d="M312 330 h80 a30 30 0 0 1 30 30 v26 a30 30 0 0 1 -30 30 h-48 l-28 24 v-24 a30 30 0 0 1 -30 -30 v-26 a30 30 0 0 1 30 -30 z"
        fill="#FFFFFF" stroke="#E3E9F8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Antigravity icon, centered in the bubble -->
  <g transform="translate(324.4 345.4) scale(2.3)">
    <g mask="url(#ag-0)"><g filter="url(#ag-1)"><path d="M-1.018-3.992c-.408 3.591 2.686 6.89 6.91 7.37 4.225.48 7.98-2.043 8.387-5.633.408-3.59-2.686-6.89-6.91-7.37-4.225-.479-7.98 2.043-8.387 5.633z" fill="#FFE432"></path></g><g filter="url(#ag-2)"><path d="M15.269 7.747c1.058 4.557 5.691 7.374 10.348 6.293 4.657-1.082 7.575-5.653 6.516-10.21-1.058-4.556-5.691-7.374-10.348-6.292-4.657 1.082-7.575 5.653-6.516 10.21z" fill="#FC413D"></path></g><g filter="url(#ag-3)"><path d="M-12.443 10.804c1.338 4.703 7.36 7.11 13.453 5.378 6.092-1.733 9.947-6.95 8.61-11.652C8.282-.173 2.26-2.58-3.833-.848-9.925.884-13.78 6.1-12.443 10.804z" fill="#00B95C"></path></g><g filter="url(#ag-4)"><path d="M-12.443 10.804c1.338 4.703 7.36 7.11 13.453 5.378 6.092-1.733 9.947-6.95 8.61-11.652C8.282-.173 2.26-2.58-3.833-.848-9.925.884-13.78 6.1-12.443 10.804z" fill="#00B95C"></path></g><g filter="url(#ag-5)"><path d="M-7.608 14.703c3.352 3.424 9.126 3.208 12.896-.483 3.77-3.69 4.108-9.459.756-12.883C2.69-2.087-3.083-1.871-6.853 1.82c-3.77 3.69-4.108 9.458-.755 12.883z" fill="#00B95C"></path></g><g filter="url(#ag-6)"><path d="M9.932 27.617c1.04 4.482 5.384 7.303 9.7 6.3 4.316-1.002 6.971-5.448 5.93-9.93-1.04-4.483-5.384-7.304-9.7-6.301-4.316 1.002-6.971 5.448-5.93 9.93z" fill="#3186FF"></path></g><g filter="url(#ag-7)"><path d="M2.572-8.185C.392-3.329 2.778 2.472 7.9 4.771c5.122 2.3 11.042.227 13.222-4.63 2.18-4.855-.205-10.656-5.327-12.955-5.122-2.3-11.042-.227-13.222 4.63z" fill="#FBBC04"></path></g><g filter="url(#ag-8)"><path d="M-3.267 38.686c-5.277-2.072 3.742-19.117 5.984-24.83 2.243-5.712 8.34-8.664 13.616-6.592 5.278 2.071 11.533 13.482 9.29 19.195-2.242 5.713-23.613 14.298-28.89 12.227z" fill="#3186FF"></path></g><g filter="url(#ag-9)"><path d="M28.71 17.471c-1.413 1.649-5.1.808-8.236-1.878-3.135-2.687-4.531-6.201-3.118-7.85 1.412-1.649 5.1-.808 8.235 1.878s4.532 6.2 3.119 7.85z" fill="#749BFF"></path></g><g filter="url(#ag-10)"><path d="M18.163 9.077c5.81 3.93 12.502 4.19 14.946.577 2.443-3.612-.287-9.727-6.098-13.658-5.81-3.931-12.502-4.19-14.946-.577-2.443 3.612.287 9.727 6.098 13.658z" fill="#FC413D"></path></g><g filter="url(#ag-11)"><path d="M-.915 2.684c-1.44 3.473-.97 6.967 1.05 7.804 2.02.837 4.824-1.3 6.264-4.772 1.44-3.473.97-6.967-1.05-7.804-2.02-.837-4.824 1.3-6.264 4.772z" fill="#FFEE48"></path></g></g>
  </g>
</svg>
